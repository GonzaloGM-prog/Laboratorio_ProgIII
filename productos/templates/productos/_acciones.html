{# Botones Modificar / Eliminar. La vista vuelve a controlar permisos y dueño. #}
{% if perms.productos.change_producto %}
    <a href="{% url 'productos:editar' producto.pk %}" class="btn-accion btn-accion-editar"
       aria-label="Modificar {{ producto.nombre }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        Modificar
    </a>
{% endif %}
{% if perms.productos.delete_producto %}
    <form method="post" action="{% url 'productos:eliminar' producto.pk %}"
          onsubmit="return confirm('¿Eliminar este producto?');">
        {% csrf_token %}
        <button type="submit" class="btn-accion btn-accion-eliminar"
                aria-label="Eliminar {{ producto.nombre }}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
            Eliminar
        </button>
    </form>
{% endif %}
